services:
  db:
    image: postgres:16
    container_name: lifepilot-db
    environment:
      POSTGRES_DB: lifepilot
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: