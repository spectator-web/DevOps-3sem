<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LifePilot — Lab 0</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
        h1 { margin-bottom: 24px; }
        .form { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .form input { padding: 8px; font-size: 14px; }
        .form input[name="name"] { flex: 2; min-width: 180px; }
        .form input[name="description"] { flex: 2; min-width: 180px; }
        .form input[name="unit"] { flex: 1; min-width: 80px; }
        .form button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>LifePilot — товары</h1>

    <form class="form" onsubmit="saveProduct(event)">
        <input name="name" placeholder="Название" required>
        <input name="description" placeholder="Описание">
        <input name="unit" placeholder="Ед. изм." required>
        <button type="submit">Сохранить</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Ед. изм.</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
